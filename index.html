<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escala Smart - Sistema de Gestão de Plantões</title>
    <meta name="description" content="Sistema profissional para gestão de equipes de segurança e controle de plantões. Gerencie trocas, equipes e escalas com facilidade." />
    <meta name="author" content="Escala Smart" />
    <meta name="theme-color" content="#1a1f2e" />
    
    <!-- Mobile App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    
    <!-- Preload critical images -->
    <link rel="preload" as="image" href="/src/assets/logo-camara.png" />

    <meta property="og:title" content="Escala Smart - Sistema de Gestão de Plantões" />
    <meta property="og:description" content="Sistema profissional para gestão de equipes de segurança e controle de plantões. Gerencie trocas, equipes e escalas com facilidade." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root">
      <!-- Loading Fallback - Exibido enquanto o React está carregando -->
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:hsl(var(--background));">
        <div style="text-align:center;max-width:300px;padding:20px;">
          <div style="width:60px;height:60px;border:4px solid hsl(var(--muted));border-top:4px solid hsl(var(--primary));border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 24px;"></div>
          <h2 style="color:hsl(var(--foreground));font-size:18px;font-weight:600;margin:0 0 8px 0;">Escala Smart</h2>
          <p style="color:hsl(var(--muted-foreground));font-size:14px;margin:0;">Carregando aplicação...</p>
        </div>
      </div>
      <style>
        @keyframes spin { 
          0% { transform: rotate(0deg); } 
          100% { transform: rotate(360deg); } 
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
